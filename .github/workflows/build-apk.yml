name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gtasa-mod-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  director-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLEO scripts
        run: |
          mkdir -p out
          for lang in en ru; do
            suffix=$([ $lang = ru ] && echo _ru || true)
            python3 mods/director/gen_director.py $lang > out/director$suffix.txt
            cmp out/director$suffix.txt mods/director/director$suffix.txt
            python3 tools/scm_asm.py out/director$suffix.txt out/director$suffix.csi
            python3 tools/scm_asm.py out/director$suffix.txt out/director$suffix.csa -D CSA
            cmp out/director$suffix.csi mods/director/build/director$suffix.csi
            cmp out/director$suffix.csa mods/director/build/director$suffix.csa
          done
          rm out/*.txt
          cp mods/director/README.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: director-cleo-mod
          path: out/
